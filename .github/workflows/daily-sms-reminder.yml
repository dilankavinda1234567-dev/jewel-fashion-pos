name: 24/7 Cloud Automated SMS & Owner Report Dispatcher

on:
  schedule:
    # 02:30 UTC = 08:00 AM Sri Lanka Time (Due Today & Morning Owner Executive Report)
    - cron: '30 2 * * *'
    # 05:00 UTC = 10:30 AM Sri Lanka Time (Overdue Warnings & Owner Overdue Report)
    - cron: '0 5 * * *'
    # 11:30 UTC = 05:00 PM Sri Lanka Time (Due Tomorrow 1-Day Warning & Owner Report)
    - cron: '30 11 * * *'
  # Allows 1-click manual trigger from GitHub Actions tab anytime
  workflow_dispatch:
    inputs:
      job_slot:
        description: 'Select Job Slot to Execute'
        required: true
        default: 'ALL_IN_ONE'
        type: choice
        options:
          - ALL_IN_ONE
          - TODAY_8AM
          - OVERDUE_1030AM
          - TOMORROW_5PM

jobs:
  dispatch-sms:
    name: Execute Cloud Automated SMS Schedule
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🚀 Run Automated SMS & Report Dispatcher
        env:
          FIREBASE_PROJECT_ID: 'jewel-58bcc'
          SMSLENZ_USER_ID: '2110'
          SMSLENZ_API_KEY: '44b6b7fc-998c-4d14-8a8c-2bd52fe251f2'
          SMSLENZ_SENDER_ID: 'J FASHION'
          JOB_SLOT: ${{ github.event.inputs.job_slot || 'AUTO' }}
        run: node scripts/cloud-reminder-cron.js
